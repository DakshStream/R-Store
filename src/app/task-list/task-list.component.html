<div class="task-page">
  <div class="task-card">
    <div class="task-header">
      <p class="eyebrow">Daily focus</p>
      <h2>My Task List</h2>
    </div>

    <div class="input-row">
      <input
        type="text"
        [value]="taskInput"
        (input)="taskInput = $any($event.target).value"
        (keyup.enter)="addTasks(taskInput)"
        placeholder="Add a new task..."
      />
      <button type="button" (click)="addTasks(taskInput)">Add task</button>
    </div>

    <div class="task-list" *ngIf="(allTasks$ | async)?.length; else emptyState">
      <div class="task-item" *ngFor="let task of (allTasks$ | async); let i = index">
        <span class="task-text">{{ task.taskName }}</span>
        <button type="button" class="delete-btn" (click)="removeTask(i)" aria-label="Remove task">×</button>
      </div>
    </div>

    <ng-template #emptyState>
      <div class="empty-state">No tasks yet. Add your first one above.</div>
    </ng-template>
  </div>
</div>
